<!DOCTYPE html>
<html>
    <head>
        <link href="styles.css" rel="stylesheet">
        <title>
            Sweet Scoop Ice Cream
        </title>
    </head>
    <body>
        <header class="main-header">
            <img src="logo.jpeg" alt="Sweet Scoop Ice Cream Logo" class="logo">
            <h1>Sweet Scoop Ice Cream</h1>
        </header>
        <div class="navbar">
            <a href="index.html">Home</a>
        </div>
        <main class="login-main" id="form-login">
            <form>
                <h1>Welcome Back!</h1>
                <label for="username">Username:</label>
                <br>
                <input type="text" id="username" name="username" class="input-style">
                <br>
                <br>
                <label for="password">Password:</label>
                <br>
                <input type="text" id="password" name="password" class="input-style">
                <br>
                <br>
                <input type="checkbox" id="forgot-password" name="forgot-password">
                <label for="forgot-password">Forgot Password</label>
                <br>
                <br>
                <button type="button" id="login-button" class="button-style">Login</button>
                <br>
                <br>
                <label for="signup-button">New user?</label>
                <button type="button" id="signup-button" class="button-style">Create an account</button>
            </form>

        </main>
        <footer class="main-footer">
            <p>© 2026 Sweet Scoop Ice Cream</p>
        </footer>
     </body>
     <script src="login_page.js"></script>
</html>
