<!DOCTYPE html>
<html>
    <head>
        <link href="styles.css" rel="stylesheet">
        <title>
            Sweet Scoop Ice Cream
        </title>
    </head>
    <body>
        <header class="main-header">
            <img src="logo.jpeg" alt="Sweet Scoop Ice Cream Logo" class="logo">
            <h1>Sweet Scoop Ice Cream</h1>
        </header>
        <div class="navbar">
            <a href="index.html">Home</a>
        </div>
        <main class="login-main" id="form-login">
            <form>
                <h1>Sign Up!</h1>
                <label for="username">Username:</label>
                <br>
                <input type="text" id="username" name="username" class="input-style">
                <br>
                <br>
                <label for="email">Email:</label>
                <br>
                <input type="text" id="email" name="email" class="input-style">
                <br>
                <br>
                <label for="password">Password:</label>
                <br>
                <input type="text" id="password" name="password" class="input-style">
                <br>
                <br> 
                <label for="confirm-password">Confirm Password:</label>
                <br>
                <input type="text" id="confirm-password" name="confirm-password" class="input-style">
                <br>
                <br> 
                <button type="button" id="signup-button" class="sign-up-button">Sign Up!</button>

                
            </form>

        </main>
        <footer class="main-footer">
            <p>© 2026 Sweet Scoop Ice Cream</p>
        </footer>
     </body>
     <script src="sign_up.js"></script>
</html>
